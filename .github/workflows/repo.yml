name: Arch Linux Haxefetch Repo Container (Release)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch-repo:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel git pacman-contrib

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build Arch Package
        run: |
          cd "$GITHUB_WORKSPACE/haxefetch"
          chown -R builder:builder .
          su builder -c "updpkgsums"
          su builder -c "makepkg -sc --noconfirm"

      - name: Update Repository Database
        run: |
          mkdir -p x86_64
          cp haxefetch/*.pkg.tar.zst x86_64/
          cd x86_64
          repo-add haxefetch.db.tar.gz haxefetch-1.0.0-1-x86_64.pkg.tar.zst
          
          rm -f haxefetch.db haxefetch.files
          cp haxefetch.db.tar.zst haxefetch.db
          [ -f haxefetch.files.tar.zst ] && cp haxefetch.files.tar.zst haxefetch.files

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          
          git add x86_64/ haxefetch/PKGBUILD
          git diff-index --quiet HEAD || git commit -m "Release v${{ github.event.release.tag_name }} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main