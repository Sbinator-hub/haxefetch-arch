name: Arch Linux Haxefetch repo container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'haxefetch/PKGBUILD'
      - 'src/**'
      - 'bin/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Mark workspace safe
        run: |
          pacman -Sy --noconfirm git pacman-contrib
          git config --global --add safe.directory "*"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          safe_directory: '*'

      - name: Create non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Generate Checksums & Build Package
        run: |
          cd "$GITHUB_WORKSPACE/haxefetch"
          chown -R builder:builder .
          
          # Run updpkgsums as builder user
          su builder -c "updpkgsums"
          
          # Build package as builder user
          su builder -c "makepkg -sc --noconfirm"

      - name: Update repository database
        run: |
          mkdir -p x86_64
          cp haxefetch/*.pkg.tar.zst x86_64/
          cd x86_64

          repo-add haxefetch.db.tar.zst *.pkg.tar.zst

          rm -f haxefetch.db haxefetch.files
          cp haxefetch.db.tar.zst haxefetch.db
          if [ -f haxefetch.files.tar.zst ]; then
            cp haxefetch.files.tar.zst haxefetch.files
          fi

      - name: Commit and push updated repo and PKGBUILD
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add x86_64/ haxefetch/PKGBUILD
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update checksums & build repo [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
