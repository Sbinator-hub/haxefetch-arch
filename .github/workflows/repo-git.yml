name: Arch Linux Haxefetch Repo Container (git)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'haxefetch-git/PKGBUILD'
      - 'src/**'
      - 'bin/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe
        run: |
          pacman -Sy --noconfirm git pacman-contrib
          git config --global --add safe.directory "*"

      - name: Create non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Generate Checksums & Build Package
        run: |
          cd "$GITHUB_WORKSPACE/haxefetch-git"
          chown -R builder:builder .
          su builder -c "updpkgsums"
          su builder -c "makepkg -sc --noconfirm"

      - name: Update repository database
        run: |
          mkdir -p x86_64
          cp haxefetch-git/*.pkg.tar.zst x86_64/
          cd x86_64

          # Uses -R to replace old git pkg entries safely when local zst is copied
          repo-add haxefetch.db.tar.zst *.pkg.tar.zst

          rm -f haxefetch.db haxefetch.files
          cp haxefetch.db.tar.zst haxefetch.db
          if [ -f haxefetch.files.tar.zst ]; then
            cp haxefetch.files.tar.zst haxefetch.files
          fi

      - name: Commit and push updated repo and PKGBUILD
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add x86_64/ haxefetch-git/PKGBUILD
          git diff-index --quiet HEAD || git commit -m "Auto-update haxefetch-git [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main